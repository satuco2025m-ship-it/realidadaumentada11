<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>WebAR Educativo - Sólidos Geométricos</title>

<!-- A-Frame 1.2.0 -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<!-- AR.js 3.4.5 -->
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

<!-- AR.js Gestures -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/examples/marker-training/examples/libs/gesture-detector.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/examples/marker-training/examples/libs/gesture-handler.js"></script>

<style>
/* =========================================================
   RESET GENERAL
========================================================= */
html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
}

/* =========================================================
   CORRECCIÓN DE PROPORCIONES (ANTI-DISTORSIÓN)
========================================================= */
canvas,
.a-canvas,
#arjs-video,
video {
    width: 100vw !important;
    height: 100vh !important;
    object-fit: cover !important;
    position: fixed !important;
    top: 0;
    left: 0;
}

/* =========================================================
   MENÚ RESPONSIVO TIPO CARRUSEL
========================================================= */
#menu {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 9999;

    width: calc(100% - 20px);
    max-width: 900px;

    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;

    display: flex;
    gap: 10px;

    padding: 10px;

    box-sizing: border-box;

    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);

    border-radius: 16px;

    -webkit-overflow-scrolling: touch;
}

#menu::-webkit-scrollbar {
    height: 5px;
}

#menu::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.4);
    border-radius: 20px;
}

.menu-btn {
    flex: 0 0 auto;

    border: none;
    outline: none;

    padding: 12px 18px;

    border-radius: 12px;

    font-size: 15px;
    font-weight: bold;

    color: white;
    background: #444;

    cursor: pointer;

    transition: 0.25s;
}

.menu-btn.active {
    background: #00AEEF;
    transform: scale(1.05);
}

.menu-btn:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<!-- =======================================================
     MENÚ DE FIGURAS
======================================================= -->
<div id="menu">

    <button class="menu-btn active" onclick="mostrarFigura('cubo', this)">
        Cubo
    </button>

    <button class="menu-btn" onclick="mostrarFigura('esfera', this)">
        Esfera
    </button>

    <button class="menu-btn" onclick="mostrarFigura('cilindro', this)">
        Cilindro
    </button>

    <button class="menu-btn" onclick="mostrarFigura('cono', this)">
        Cono
    </button>

</div>

<!-- =======================================================
     ESCENA AR
======================================================= -->
<a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
        logarithmicDepthBuffer: true;
        antialias: true;
        alpha: true;
        precision: medium;
    "

    gesture-detector

    arjs="
        sourceType: webcam;
        videoScaleMode: cover;
        debugUIEnabled: false;
    "
>

    <!-- ===================================================
         MARCADOR HIRO
    ==================================================== -->
    <a-marker preset="hiro">

        <!-- ===============================================
             ENTIDAD MAESTRA MANIPULABLE
             (ROTACIÓN + ZOOM)
        ================================================ -->
        <a-entity

            id="grupoFiguras"

            position="0 0.5 0"

            scale="0.4 0.4 0.4"

            rotation="0 0 0"

            gesture-handler="
                minScale: 0.1;
                maxScale: 1.5;
            "
        >

            <!-- ===========================================
                 CUBO
            ============================================ -->
            <a-entity id="cubo" visible="true">

                <!-- sólido -->
                <a-box
                    color="#FF5252"
                    depth="1"
                    height="1"
                    width="1">
                </a-box>

                <!-- aristas -->
                <a-box
                    color="#FFFFFF"
                    depth="1"
                    height="1"
                    width="1"
                    scale="1.005 1.005 1.005"
                    material="wireframe:true;">
                </a-box>

            </a-entity>

            <!-- ===========================================
                 ESFERA
            ============================================ -->
            <a-entity id="esfera" visible="false">

                <a-sphere
                    radius="0.6"
                    color="#4CAF50">
                </a-sphere>

                <a-sphere
                    radius="0.6"
                    scale="1.005 1.005 1.005"
                    color="#FFFFFF"
                    material="wireframe:true;">
                </a-sphere>

            </a-entity>

            <!-- ===========================================
                 CILINDRO CIRCULAR RECTO
            ============================================ -->
            <a-entity id="cilindro" visible="false">

                <a-cylinder
                    radius="0.45"
                    height="1.2"
                    color="#2196F3">
                </a-cylinder>

                <a-cylinder
                    radius="0.45"
                    height="1.2"
                    scale="1.005 1.005 1.005"
                    color="#FFFFFF"
                    material="wireframe:true;">
                </a-cylinder>

            </a-entity>

            <!-- ===========================================
                 CONO CIRCULAR RECTO
            ============================================ -->
            <a-entity id="cono" visible="false">

                <a-cone
                    radius-bottom="0.6"
                    radius-top="0"
                    height="1.3"
                    color="#FFC107">
                </a-cone>

                <a-cone
                    radius-bottom="0.6"
                    radius-top="0"
                    height="1.3"
                    scale="1.005 1.005 1.005"
                    color="#FFFFFF"
                    material="wireframe:true;">
                </a-cone>

            </a-entity>

        </a-entity>

    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>

</a-scene>

<script>
/* =========================================================
   VARIABLES GLOBALES
========================================================= */
const figuras = [
    "cubo",
    "esfera",
    "cilindro",
    "cono"
];

const escalaInicial = "0.4 0.4 0.4";
const rotacionInicial = "0 0 0";

/* =========================================================
   CAMBIO DE FIGURAS
========================================================= */
function mostrarFigura(nombreFigura, botonActual) {

    figuras.forEach(figura => {
        document
            .getElementById(figura)
            .setAttribute("visible", false);
    });

    document
        .getElementById(nombreFigura)
        .setAttribute("visible", true);

    document
        .querySelectorAll(".menu-btn")
        .forEach(btn => btn.classList.remove("active"));

    botonActual.classList.add("active");

    // Reiniciar transformaciones
    const grupo = document.getElementById("grupoFiguras");

    grupo.setAttribute("scale", escalaInicial);
    grupo.setAttribute("rotation", rotacionInicial);
}

/* =========================================================
   CORRECCIÓN DE MATRIZ DE PROYECCIÓN
   (ANTI-DEFORMACIÓN)
========================================================= */
window.addEventListener("load", () => {

    const scene = document.querySelector("a-scene");

    scene.addEventListener("camera-init", () => {

        setTimeout(() => {

            window.dispatchEvent(
                new Event("resize")
            );

        }, 300);

    });

});

/* =========================================================
   SEGURIDAD PARA REPRODUCCIÓN DE WEBCAM
========================================================= */
window.addEventListener("load", () => {

    setTimeout(() => {

        const video = document.querySelector("#arjs-video");

        if (video) {

            video.setAttribute("playsinline", true);

            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.catch(() => {});
            }
        }

    }, 1000);

});

/* =========================================================
   REFORZAR RESIZE EN CAMBIOS DE ORIENTACIÓN
========================================================= */
window.addEventListener("orientationchange", () => {

    setTimeout(() => {
        window.dispatchEvent(
            new Event("resize")
        );
    }, 500);

});

window.addEventListener("resize", () => {

    setTimeout(() => {
        window.dispatchEvent(
            new Event("resize")
        );
    }, 100);

});
</script>

</body>
</html>
