<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR: Sólidos Geométricos Educativos</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        /* 3. ESTILOS ESTRICTOS ANTI-DISTORSIÓN OPTICA */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Fuerza al video inyectado por AR.js a cubrir la pantalla sin deformar el aspect-ratio */
        #arjs-video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* Asegura el canvas de A-Frame en el mismo espacio viewport */
        .a-canvas {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        /* INTERFAZ DE USUARIO (UI) FLOTANTE Y RESPONSIVE */
        .ui-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            z-index: 9999; /* Z-Index ultra alto para superponerse al canvas 3D */
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        /* Configuración del carrusel horizontal con scroll responsivo */
        .menu-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Oculta scrollbar en Firefox */
        }

        .menu-scroller::-webkit-scrollbar {
            display: none; /* Oculta scrollbar en Chrome/Safari */
        }

        /* Estilos de los botones del menú interactivo */
        .btn-solid {
            flex: 0 0 auto;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-solid:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-solid.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }

        /* Letrero informativo superior */
        .info-header {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="info-header">Apunta al marcador 'Hiro' • Usa 1 dedo para rotar y 2 para zoom</div>

    <div class="ui-container">
        <div class="menu-scroller">
            <button class="btn-solid active" onclick="switchSolid('cubo', this)">Cubo</button>
            <button class="btn-solid" onclick="switchSolid('esfera', this)">Esfera</button>
            <button class="btn-solid" onclick="switchSolid('cilindro', this)">Cilindro</button>
            <button class="btn-solid" onclick="switchSolid('cono', this)">Cono</button>
        </div>
    </div>

    <a-scene 
        arjs="sourceType: webcam; videoScaleMode: cover; debugUIEnabled: false;"
        embedded 
        vr-mode-ui="enabled: false;"
        gesture-detector
        id="scene">
        
        <a-assets></a-assets>

        <a-marker 
            preset="hiro" 
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
            id="marker">
            
            <a-entity 
                id="master-container"
                gesture-handler="minScale: 0.1; maxScale: 1.5"
                scale="0.4 0.4 0.4"
                position="0 0.2 0"
                rotation="0 0 0">
                
                <a-entity id="solid-cubo" visible="true">
                    <a-box 
                        width="1" height="1" depth="1" 
                        material="color: #ef4444; roughness: 0.3; metalness: 0.1;">
                    </a-box>
                    <a-box 
                        width="1.005" height="1.005" depth="1.005" 
                        material="color: #ffffff; wireframe: true; wireframeLineWidth: 2;">
                    </a-box>
                </a-entity>

                <a-entity id="solid-esfera" visible="false">
                    <a-sphere 
                        radius="0.6" 
                        material="color: #10b981; roughness: 0.3; metalness: 0.1;">
                    </a-sphere>
                    <a-sphere 
                        radius="0.603" 
                        material="color: #ffffff; wireframe: true; wireframeLineWidth: 1.5;">
                    </a-sphere>
                </a-entity>

                <a-entity id="solid-cilindro" visible="false">
                    <a-cylinder 
                        radius="0.5" height="1.2" 
                        material="color: #f59e0b; roughness: 0.3; metalness: 0.1;">
                    </a-cylinder>
                    <a-cylinder 
                        radius="0.5025" height="1.206" 
                        material="color: #ffffff; wireframe: true; wireframeLineWidth: 1.5;">
                    </a-cylinder>
                </a-entity>

                <a-entity id="solid-cono" visible="false">
                    <a-cone 
                        radius-bottom="0.6" radius-top="0" height="1.2" 
                        material="color: #8b5cf6; roughness: 0.3; metalness: 0.1;">
                    </a-cone>
                    <a-cone 
                        radius-bottom="0.603" radius-top="0" height="1.206" 
                        material="color: #ffffff; wireframe: true; wireframeLineWidth: 1.5;">
                    </a-cone>
                </a-entity>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const solids = ['cubo', 'esfera', 'cilindro', 'cono'];
        const masterContainer = document.getElementById('master-container');
        const scene = document.getElementById('scene');

        /**
         * Manejador de intercambio de visualización de sólidos geométricos
         * Resetea matrices de transformación para evitar la propagación de deformaciones previas.
         */
        function switchSolid(selectedSolid, buttonElement) {
            // 1. Alternar visibilidad de las entidades 3D
            solids.forEach(solid => {
                const entity = document.getElementById(`solid-${solid}`);
                if (entity) {
                    entity.setAttribute('visible', solid === selectedSolid);
                }
            });

            // 2. Actualizar estados visuales de la UI (Clase activa)
            document.querySelectorAll('.btn-solid').forEach(btn => {
                btn.classList.remove('active');
            });
            buttonElement.classList.add('active');

            // 3. Reseteo Estricto de Transformación de la Entidad Maestra
            // Evita que un zoom o rotación exagerada destruya la experiencia del siguiente sólido escolar
            masterContainer.setAttribute('scale', '0.4 0.4 0.4');
            masterContainer.setAttribute('rotation', '0 0 0');
        }

        /**
         * Forzado de recalculo de proyección ortogonal para evitar estiramientos asimétricos
         */
        scene.addEventListener('camera-init', () => {
            // Retraso controlado para asegurar la inyección completa del feed de la cámara en el DOM
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 300);
        });

        /**
         * Disparador de seguridad ante las políticas restrictivas de AutoPlay de navegadores móviles
         */
        window.addEventListener('touchstart', function() {
            const video = document.getElementById('arjs-video');
            if (video && video.paused) {
                video.play().catch(err => console.log("Video Play interceptado o requiere interacción previa:", err));
            }
        }, { once: true }); // Se ejecuta solo la primera vez que se toca la pantalla
    </script>
</body>
</html>
