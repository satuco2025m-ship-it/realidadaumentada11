<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR: Sólidos Geométricos Educativos</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <style>
        /* Reseteo básico y eliminación de scrolls globales */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* ------------------------------------------- */
        /* INYECCIÓN ESTABLE Y CONTROL ÓPTICO (ANTI-DISTORSIÓN) */
        /* ------------------------------------------- */
        /* Forzamos al canvas de A-Frame y al video inyectado por AR.js a cubrir la pantalla */
        #arjs-video, .a-canvas {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* ------------------------------------------- */
        /* INTERFAZ DE USUARIO (UI) FLOTANTE RESPONSIVA */
        /* ------------------------------------------- */
        .ui-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            z-index: 9999; /* Z-index ultra alto para evitar solapamiento con el canvas */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        /* Carrusel horizontal responsive con Scroll Táctil nativo */
        .ui-menu {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none; /* Oculta scrollbar en Firefox */
            padding-bottom: 2px;
        }

        /* Oculta scrollbar en Chrome, Safari y Opera */
        .ui-menu::-webkit-scrollbar {
            display: none;
        }

        /* Estilo general de los botones interactivos */
        .btn-shape {
            flex: 0 0 auto; /* Evita que los botones se encojan en pantallas pequeñas */
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Estado activo (Sólido seleccionado en pantalla) */
        .btn-shape.active {
            background: #00ffcc;
            color: #000000;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        /* Indicador educativo superior */
        .edu-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="edu-header">Apunta al marcador 'Hiro' para interactuar</div>

    <div class="ui-container">
        <div class="ui-menu">
            <button class="btn-shape active" onclick="switchShape('cubo', this)">Cubo</button>
            <button class="btn-shape" onclick="switchShape('esfera', this)">Esfera</button>
            <button class="btn-shape" onclick="switchShape('cilindro', this)">Cilindro</button>
            <button class="btn-shape" onclick="switchShape('cono', this)">Cono</button>
        </div>
    </div>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoScaleMode: cover; debugUIEnabled: false;"
        gesture-detector
        id="scene">
        
        <a-marker preset="hiro" id="hiro-marker">
            
            <a-entity 
                id="master-container" 
                gesture-handler="minScale: 0.1; maxScale: 1.5"
                position="0 0 0"
                scale="0.4 0.4 0.4"
                rotation="0 0 0">
                
                <a-entity id="shape-cubo" visible="true">
                    <a-box 
                        position="0 0.5 0" 
                        width="1" height="1" depth="1" 
                        material="color: #ff3366; roughness: 0.3; metalness: 0.2;">
                    </a-box>
                    <a-box 
                        position="0 0.5 0" 
                        width="1" height="1" depth="1" 
                        scale="1.005 1.005 1.005"
                        material="color: #ffffff; wireframe: true; wireframeLinewidth: 2;">
                    </a-box>
                </a-entity>

                <a-entity id="shape-esfera" visible="false">
                    <a-sphere 
                        position="0 0.5 0" 
                        radius="0.5" 
                        material="color: #33ccff; roughness: 0.3; metalness: 0.2;">
                    </a-sphere>
                    <a-sphere 
                        position="0 0.5 0" 
                        radius="0.5" 
                        scale="1.005 1.005 1.005"
                        material="color: #ffffff; wireframe: true; wireframeLinewidth: 1;">
                    </a-sphere>
                </a-entity>

                <a-entity id="shape-cilindro" visible="false">
                    <a-cylinder 
                        position="0 0.5 0" 
                        radius="0.4" height="1" 
                        material="color: #ffcc00; roughness: 0.3; metalness: 0.2;">
                    </a-cylinder>
                    <a-cylinder 
                        position="0 0.5 0" 
                        radius="0.4" height="1" 
                        scale="1.005 1.005 1.005"
                        material="color: #ffffff; wireframe: true; wireframeLinewidth: 1.5;">
                    </a-cylinder>
                </a-entity>

                <a-entity id="shape-cono" visible="false">
                    <a-cone 
                        position="0 0.5 0" 
                        radius-bottom="0.5" radius-top="0" height="1" 
                        material="color: #9933ff; roughness: 0.3; metalness: 0.2;">
                    </a-cone>
                    <a-cone 
                        position="0 0.5 0" 
                        radius-bottom="0.5" radius-top="0" height="1" 
                        scale="1.005 1.005 1.005"
                        material="color: #ffffff; wireframe: true; wireframeLinewidth: 1.5;">
                    </a-cone>
                </a-entity>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </scene>

    <script>
        // Referencias principales del DOM
        const masterContainer = document.getElementById('master-container');
        const shapes = {
            cubo: document.getElementById('shape-cubo'),
            esfera: document.getElementById('shape-esfera'),
            cilindro: document.getElementById('shape-cilindro'),
            cono: document.getElementById('shape-cono')
        };

        /**
         * LÓGICA DE CONTROL DE VISIBILIDAD: Alterna entre figuras geométricas
         * y resetea las matrices de transformación del contenedor maestro.
         */
        function switchShape(selectedKey, buttonElement) {
            // 1. Alternar visibilidad de las entidades 3D
            for (const key in shapes) {
                if (shapes.hasOwnProperty(key)) {
                    shapes[key].setAttribute('visible', key === selectedKey);
                }
            }

            // 2. Actualizar las clases '.active' de la interfaz de usuario
            const buttons = document.querySelectorAll('.btn-shape');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // 3. RESETEO DE MATRICES INTERACTIVAS: Evita deformaciones heredadas del pinch-to-zoom previo
            masterContainer.setAttribute('scale', '0.4 0.4 0.4');
            masterContainer.setAttribute('rotation', '0 0 0');
        }

        /**
         * PARCHE DE OPTIMIZACIÓN ÓPTICA (ANTI-DISTORSIÓN):
         * Cuando la cámara inicializa, forzamos un redibujado geométrico de la pantalla
         * para recalcular la matriz de proyección ortogonal sin estiramientos de aspect-ratio.
         */
        const scene = document.getElementById('scene');
        scene.addEventListener('camera-init', () => {
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 500); // Pequeño delay de asentamiento del hardware de la cámara
        });

        /**
         * POLÍTICA DE SEGURIDAD PRIVADA DE NAVEGADORES MÓVILES:
         * Algunos navegadores detienen de forma agresiva la reproducción automática de streams de video.
         * Forzamos el play en el elemento nativo una vez la ventana se estabilice por completo.
         */
        window.addEventListener('load', () => {
            setTimeout(() => {
                const video = document.getElementById('arjs-video');
                if (video && video.paused) {
                    video.play().catch(err => {
                        console.warn("La reproducción automática de la cámara requirió interacción:", err);
                    });
                }
            }, 1000);
        });
    </script>
</body>
</html>
