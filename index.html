<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Educación WebAR: Sólidos Geométricos Corregidos</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <style>
        /* ESTILOS ESTRICTOS ANTIDISTORSIÓN */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000; /* Fondo negro base por si tarda en cargar la cámara */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fuerza al canvas a mantener proporciones reales sin estirarse en pantallas alargadas */
        a-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        /* Corrección para el elemento de video nativo que inyecta AR.js */
        #arjs-video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        /* INTERFAZ DE USUARIO (UI) */
        #ui-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            z-index: 9999;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        .menu-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .menu-scroll::-webkit-scrollbar {
            display: none;
        }

        .btn-solido {
            flex: 0 0 auto;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .btn-solido.active {
            background-color: #007AFF;
            color: #ffffff;
            border-color: #007AFF;
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.5);
        }

        #instrucciones {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="instrucciones">Escanea el marcador 'Hiro' • Usa tus dedos para rotar/hacer zoom</div>

    <div id="ui-container">
        <div class="menu-scroll">
            <button class="btn-solido active" onclick="cambiarSolido('cubo', this)">Cubo</button>
            <button class="btn-solido" onclick="cambiarSolido('esfera', this)">Esfera</button>
            <button class="btn-solido" onclick="cambiarSolido('cilindro', this)">Cilindro</button>
            <button class="btn-solido" onclick="cambiarSolido('cono', this)">Cono</button>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; videoScaleMode: cover; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        gesture-detector>
        
        <a-marker preset="hiro" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            
            <a-entity 
                id="grupo-maestro" 
                position="0 0.2 0"
                scale="1 1 1"
                gesture-handler="minScale: 0.2; maxScale: 2.0">
                
                <a-entity id="solido-cubo" class="clickable" visible="true">
                    <a-box 
                        position="0 0 0" 
                        scale="0.4 0.4 0.4" 
                        color="#FF3B30" 
                        material="roughness: 0.3; metalness: 0.1">
                    </a-box>
                    <a-box 
                        position="0 0 0" 
                        scale="0.402 0.402 0.402" 
                        color="#FFFFFF" 
                        material="wireframe: true; wireframeLineWidth: 2">
                    </a-box>
                </a-entity>

                <a-entity id="solido-esfera" class="clickable" visible="false">
                    <a-sphere 
                        position="0 0 0" 
                        radius="0.25" 
                        color="#34C759" 
                        material="roughness: 0.3">
                    </a-sphere>
                    <a-sphere 
                        position="0 0 0" 
                        radius="0.251" 
                        color="#000000" 
                        material="wireframe: true; wireframeLineWidth: 1.5">
                    </a-sphere>
                </a-entity>

                <a-entity id="solido-cilindro" class="clickable" visible="false">
                    <a-cylinder 
                        position="0 0 0" 
                        radius="0.2" 
                        height="0.5" 
                        color="#AF52DE" 
                        material="roughness: 0.3">
                    </a-cylinder>
                    <a-cylinder 
                        position="0 0 0" 
                        radius="0.201" 
                        height="0.502" 
                        color="#FFFFFF" 
                        material="wireframe: true; wireframeLineWidth: 1.5">
                    </a-cylinder>
                </a-entity>

                <a-entity id="solido-cono" class="clickable" visible="false">
                    <a-cone 
                        position="0 0 0" 
                        radius-bottom="0.25" 
                        radius-top="0" 
                        height="0.5" 
                        color="#FFCC00" 
                        material="roughness: 0.3">
                    </a-cone>
                    <a-cone 
                        position="0 0 0" 
                        radius-bottom="0.252" 
                        radius-top="0" 
                        height="0.502" 
                        color="#000000" 
                        material="wireframe: true; wireframeLineWidth: 1.5">
                    </a-cone>
                </a-entity>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const solidos = {
            cubo: document.getElementById('solido-cubo'),
            esfera: document.getElementById('solido-esfera'),
            cilindro: document.getElementById('solido-cilindro'),
            cono: document.getElementById('solido-cono')
        };

        const grupoMaestro = document.getElementById('grupo-maestro');

        function cambiarSolido(solidoSeleccionado, botonActivo) {
            for (const llave in solidos) {
                if (solidos.hasOwnProperty(llave)) {
                    solidos[llave].setAttribute('visible', llave === solidoSeleccionado);
                }
            }

            document.querySelectorAll('.btn-solido').forEach(btn => {
                btn.classList.remove('active');
            });
            botonActivo.classList.add('active');

            // Reset de transformaciones
            grupoMaestro.setAttribute('scale', '1 1 1');
            grupoMaestro.setAttribute('rotation', '0 0 0');
        }

        // LÓGICA DE DETECCIÓN Y REDIMENSIONAMIENTO FORZADO
        window.addEventListener('DOMContentLoaded', () => {
            // Forzar a la escena a recalcular sus dimensiones cuando la cámara de AR.js se inyecte
            const scene = document.querySelector('a-scene');
            
            scene.addEventListener('camera-init', () => {
                // Pequeño hack de delay para asegurar que el viewport del dispositivo se ha estabilizado
                setTimeout(() => {
                    window.dispatchEvent(new Event('resize'));
                }, 500);
            });

            // Disparador de seguridad para reproducción de video
            setTimeout(() => {
                const video = document.querySelector('video');
                if (video && video.paused) {
                    video.play().catch(err => console.log("Cámara pausada por política del navegador. Esperando interacción."));
                }
            }, 1000);
        });
    </script>
</body>
</html>
