<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>WebAR Educativo - Sólidos Geométricos</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<!-- AR.js 3.4.5 -->
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

<!-- AR.js Gestures -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/marker-training/examples/libs/gesture-detector.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/marker-training/examples/libs/gesture-handler.js"></script>

<style>
/* =====================================================
   REGLAS CRÍTICAS ANTI-PANTALLA EN BLANCO
===================================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background-color: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

/* Escena AR ocupando toda la pantalla */
a-scene {
    position: absolute !important;
    top: 0;
    left: 0;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 1;
}

/* =====================================================
   MENÚ FLOTANTE RESPONSIVE CON SCROLL HORIZONTAL
===================================================== */
#menu {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;

    width: 95%;
    max-width: 900px;

    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;

    display: block;

    padding: 10px;
    border-radius: 14px;

    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);

    -webkit-overflow-scrolling: touch;
}

/* Ocultar scrollbar visualmente */
#menu::-webkit-scrollbar {
    height: 4px;
}

#menu button {
    display: inline-block;

    margin: 0 5px;
    padding: 12px 18px;

    border: none;
    border-radius: 10px;

    background: #ffffff;
    color: #111;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.25s;
}

#menu button.active {
    background: #00c853;
    color: white;
}

#menu button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<!-- =====================================================
     MENÚ DE SELECCIÓN DE SÓLIDOS
===================================================== -->
<div id="menu">
    <button class="active" onclick="mostrarSolido('cubo', this)">Cubo</button>
    <button onclick="mostrarSolido('esfera', this)">Esfera</button>
    <button onclick="mostrarSolido('cilindro', this)">Cilindro</button>
    <button onclick="mostrarSolido('cono', this)">Cono</button>
</div>

<!-- =====================================================
     ESCENA AR
===================================================== -->
<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    gesture-detector
    arjs="
        trackingMethod: best;
        sourceType: webcam;
        debugUIEnabled: false;
    "
>

    <!-- Cámara -->
    <a-entity camera></a-entity>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro">

        <!-- =====================================================
             ENTIDAD MAESTRA MANIPULABLE
             (ZOOM Y ROTACIÓN)
        ====================================================== -->
        <a-entity
            id="grupoSolidos"
            position="0 0.4 0"
            scale="1 1 1"
            gesture-handler="
                minScale: 0.1;
                maxScale: 1.5;
            "
        >

            <!-- ==========================================
                 CUBO
                 Dimensiones idénticas en X,Y,Z
            =========================================== -->
            <a-entity id="cubo" visible="true">

                <!-- sólido -->
                <a-box
                    position="0 0 0"
                    width="0.4"
                    height="0.4"
                    depth="0.4"
                    color="#FF5252">
                </a-box>

                <!-- aristas -->
                <a-box
                    position="0 0 0"
                    width="0.405"
                    height="0.405"
                    depth="0.405"
                    material="
                        color: #000000;
                        wireframe: true;
                        wireframeLinewidth: 2;
                    ">
                </a-box>

            </a-entity>

            <!-- ==========================================
                 ESFERA
                 Simetría radial perfecta
            =========================================== -->
            <a-entity id="esfera" visible="false">

                <a-sphere
                    radius="0.22"
                    color="#2979FF">
                </a-sphere>

                <a-sphere
                    radius="0.225"
                    material="
                        color: #FFFFFF;
                        wireframe: true;
                    ">
                </a-sphere>

            </a-entity>

            <!-- ==========================================
                 CILINDRO CIRCULAR RECTO
            =========================================== -->
            <a-entity id="cilindro" visible="false">

                <a-cylinder
                    radius="0.18"
                    height="0.45"
                    color="#00C853">
                </a-cylinder>

                <a-cylinder
                    radius="0.185"
                    height="0.455"
                    material="
                        color: #000000;
                        wireframe: true;
                    ">
                </a-cylinder>

            </a-entity>

            <!-- ==========================================
                 CONO CIRCULAR RECTO
            =========================================== -->
            <a-entity id="cono" visible="false">

                <a-cone
                    radius-bottom="0.22"
                    radius-top="0"
                    height="0.45"
                    color="#FFD600">
                </a-cone>

                <a-cone
                    radius-bottom="0.225"
                    radius-top="0"
                    height="0.455"
                    material="
                        color: #000000;
                        wireframe: true;
                    ">
                </a-cone>

            </a-entity>

        </a-entity>

    </a-marker>

</a-scene>

<script>
/* =====================================================
   REFERENCIAS
===================================================== */
const grupo = document.getElementById("grupoSolidos");

const solidos = {
    cubo: document.getElementById("cubo"),
    esfera: document.getElementById("esfera"),
    cilindro: document.getElementById("cilindro"),
    cono: document.getElementById("cono")
};

/* =====================================================
   CAMBIO DE FIGURA
===================================================== */
function mostrarSolido(nombre, botonActivo) {

    // Ocultar todos
    Object.values(solidos).forEach(solido => {
        solido.setAttribute("visible", false);
    });

    // Mostrar seleccionado
    solidos[nombre].setAttribute("visible", true);

    // Restablecer escala
    grupo.setAttribute("scale", "1 1 1");

    // Estado visual botones
    document.querySelectorAll("#menu button")
        .forEach(btn => btn.classList.remove("active"));

    botonActivo.classList.add("active");
}

/* =====================================================
   SEGURIDAD PARA ACTIVAR WEBCAM EN MÓVILES
===================================================== */
window.addEventListener("load", () => {

    setTimeout(() => {

        const videos = document.querySelectorAll("video");

        videos.forEach(video => {
            if (video) {
                video.setAttribute("playsinline", true);
                video.setAttribute("muted", true);

                const promise = video.play();

                if (promise !== undefined) {
                    promise.catch(() => {
                        console.log("Esperando interacción del usuario...");
                    });
                }
            }
        });

    }, 1500);
});

/* =====================================================
   SEGURIDAD EXTRA SI AR.JS CREA EL VIDEO DESPUÉS
===================================================== */
const observer = new MutationObserver(() => {

    const video = document.querySelector("video");

    if (video) {

        video.setAttribute("playsinline", true);
        video.setAttribute("muted", true);

        setTimeout(() => {
            video.play().catch(() => {});
        }, 1000);

        observer.disconnect();
    }
});

observer.observe(document.body, {
    childList: true,
    subtree: true
});
</script>

</body>
</html>
